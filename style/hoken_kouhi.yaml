# ==== 文体・編集設定：「じぶんの薬局」保険と公費のギモン（水曜号） ====
# src/note_hoken.py が prompt_digest（と下の各項目）を NotebookLM / Strata への指示に埋め込みます。
# 書き方の基本は土曜号（style/jibun_yakkyoku.yaml）と同じ。違うのは「1テーマを Q&A で掘る」こと。
# 自由に書き換えてOK。

name: じぶんの薬局
magazine: 保険と公費のギモン

# ---------------------------------------------------------------
# 0. 編集方針（著者の言葉をもとに。すべての項目より優先）
# ---------------------------------------------------------------
editorial_policy: |
  保険診療・公費負担医療の「よく迷うところ」を、行政資料（告示・通知・事務連絡・疑義解釈）で確かめるためのマガジン。
  毎回1テーマ。現場で出る疑問を Q&A にして、答えと根拠（通知名・項番）を並べる。
  解釈・推奨は入れない。資料に書いてあることだけを書き、判断は原文と審査支払機関・保険者に当たってもらう。
  長い文は嫌われる。端的に書く。

# ---------------------------------------------------------------
# 1. 書き方（土曜号と同じ）
# ---------------------------------------------------------------
voice:
  register: です・ます体。体言止めも可。だ・である は使わない。
  endings:
    - ×「算定できる。」→ ○「算定できます。」
    - ×「〜である。」→ ○「〜です。」
    - ×「対象外となる。」→ ○「対象外です。」
  content: ファクトのみ。解釈・感想・推奨・「〜かと思います」「〜と考えられます」は書かない。
  forbidden_phrases: [かと思います, と考えられます, が期待されます, 注目されます, 画期的, 必見, 朗報, 結論から言うと, まとめてみた, いかがでしたか, 裏ワザ, 損しない]

sentences:
  max_chars: 40
  notation: |
    - 数値と単位は半角（20点、3割、月2回）。範囲は「1〜3回」。
    - 点数・加算名は告示どおりの正式名（例「外来腫瘍化学療法診療料」）。2回目以降は略してよい。
    - 通知は「令和8年3月5日保医発0305第4号」、事務連絡は「疑義解釈資料の送付について（その13）（令和8年9月25日事務連絡）」の形。
    - 疑義解釈を根拠にするときは、問の番号も書く（例「問12」）。
    - 『』・絵文字・「→」・感嘆符は使わない。補足は「※」。

# ---------------------------------------------------------------
# 2. 1問の型（疑問 → 答え → 根拠 → 注意）
# ---------------------------------------------------------------
qa_block:
  heading: 小見出し（note の「小見出し」）。現場で出る疑問を、そのまま短い問いの形で。40字以内。「Q.」で始める。
  lines:
    - label: 答え
      rule: 資料に書かれた答え。1〜2文。「算定できます／できません」「対象です／対象外です」を先に。
    - label: 根拠
      rule: 通知・告示・事務連絡の名前と項番（疑義解釈なら問番号）。1行。
    - label: 条件・例外
      rule: 任意。答えが変わる条件・例外・届出の要否。1〜2文。資料に無ければ行ごと省く。
    - label: 出典
      rule: 根拠資料のリンク（厚労省・厚生局・審査支払機関・自治体）。
  format_example: |
    ### Q. 同じ月に2回目の〇〇管理料は算定できる？
    **答え**　算定できません。月1回に限り算定します。
    **根拠**　疑義解釈資料の送付について（その3）（令和8年4月20日事務連絡）問12。
    **条件・例外**　〇〇の場合は、別に△△加算を算定できます。
    **出典**　厚生労働省「令和8年度診療報酬改定について」
  special_rules:
    - 資料に答えが無い疑問は書かない（「明確な規定はありません」と作文しない）。
    - 保険診療と公費（難病・小児慢性・生活保護・自立支援医療など）の扱いが違うときは、別の問に分ける。
    - 都道府県・保険者で扱いが違うと資料にあれば、そのとおり書く。
    - 施行日・経過措置の期限は答えか条件・例外に必ず書く（資料にあれば）。

# ---------------------------------------------------------------
# 3. 号の構成
# ---------------------------------------------------------------
issue:
  title: "【保険と公費のギモン】{theme}"
  greeting: "今回のテーマは「{theme}」です。"
  three_lines_heading: 今回の3行
  qa_heading: よくある疑問
  links_heading: 根拠資料（まとめ）
  afterword_heading: 編集後記
  afterword: "【任意：ご自身で一言。不要ならこの見出しごと削除】"
  max_qa: 7
  total_length: 1500〜3000字

opening_notice:
  heading: この記事について
  body: |
    この記事は、公開されている行政資料をもとにAI（NotebookLM 等）が作成した下書きを、筆者が確認して掲載しています。
    目的は、保険診療・公費負担医療のよく迷うところを、根拠資料から素早く確かめることです。
    実際の算定・請求にあたっては、必ず通知・事務連絡の原文をご確認ください。
    算定や請求の判断は、審査支払機関・保険者・自治体の解釈もあわせてご確認ください。
    また、このマガジンは情報収集の自動化を試す実験の場でもあります。
    誤りや誤謬を見つけて改善していく過程も含めて公開しています。お気づきの点はコメントでお知らせください。

fixed_footer: |
  ※このマガジンは、保険診療・公費負担医療のよくある疑問を、行政資料で確かめるための「見出し集」です。詳細・判断は必ず原文（告示・通知・事務連絡）でご確認ください。
  ※公開情報をもとにAI（NotebookLM 等）で下書きを作成し、筆者が内容を確認したものです。
  ※記事の内容は私の見解であり、薬剤師の助言や指導でないことをご了承ください。医療従事者向けの情報です。

# NotebookLM の音声（この号の資料から作る）を「今回の3行」のすぐ下に埋め込む
podcast:
  enabled: true
  heading: 音声版（AI音声）
  audio_title: 保険と公費のギモン：{theme}（AI音声）
  author: じぶんの薬局（NotebookLM による AI音声）
  cover: assets/onco.png
  body: |
    今回のテーマを音声でまとめたものです。NotebookLM（Google）で自動生成したAI音声で、話者は実在の人物ではありません。
    内容に誤りを含む可能性があります。算定・請求は原文でご確認ください。
  instructions: |
    医療従事者（薬剤師・医療事務）向けに、資料にある行政資料（告示・通知・事務連絡・疑義解釈）だけをもとに、
    今回のテーマのよくある疑問と答えを、根拠の通知名・問番号とあわせて解説してください。
    資料に無い解釈や推測は話さないでください。最後に「算定・請求は原文と審査支払機関の解釈で確認を」と添えてください。

hashtags:
  fixed: [薬剤師, 保険診療, 診療報酬, 調剤報酬, 公費負担医療, 疑義解釈, 病院薬剤師]
  per_issue: その号の点数・加算名・制度名から4〜7個。合計14個まで

rules:
  must:
    - 答え・条件・数値・日付は資料に書いてあることだけ。資料に無い行は省く（「記載なし」とも書かない）。
    - 文末は「〜します」「〜です」か体言止め。「〜できる。」「〜である。」「〜だ。」は使わない。
    - 1文40字以内。超えたら分ける。
    - すべての問に根拠（通知名・項番）と出典を付ける。
  never:
    - 解釈・評価・推奨・「この場合は算定してよいと考えられます」のような推測。
    - 資料に答えが無い疑問を、それらしく作文すること。
    - 筆者の体験談・勤務先の話を作る。

# ---------------------------------------------------------------
# 4. NotebookLM / Strata に渡す圧縮版
# ---------------------------------------------------------------
prompt_digest: |
  医療従事者（薬剤師・医療事務）向けの「保険と公費のギモン」の下書きを書く。目的は、保険診療・公費負担医療のよく迷うところを、行政資料で素早く確かめること。
  【書き方】ファクトのみ。解釈・評価・推奨・推測は書かない（「〜と考えられます」などは禁止）。1文40字以内、1文1事実。
  【文末】必ず です・ます体 か 体言止め。だ・である体は禁止。×「算定できる。」→ ○「算定できます。」
  【1問の型】小見出し「Q. 〜？」（40字以内）の下に、ラベル付きの行で：
  「答え」資料に書かれた答え（できる／できない・対象／対象外を先に）／「根拠」通知・事務連絡の名前と項番（疑義解釈は問番号）／「条件・例外」答えが変わる条件・届出・経過措置（任意）／「出典」資料のリンク。
  資料に答えが無い疑問は書かない。資料に無い行は省く（「記載なし」とも書かない）。
  【表記】数値・単位は半角、点数・加算名は告示どおり。絵文字・「→」・感嘆符は使わない。
  資料に書かれていない事実・数値・日付・算定可否は絶対に書かない。
