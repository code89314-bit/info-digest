# ==== 文体・編集設定：「じぶんの薬局」ギモン深堀り（Discord の疑問深堀チャンネルから） ====
# src/qa_deep.py が prompt_digest（と下の各項目）を NotebookLM / Strata への指示に埋め込みます。
# 書き方の手本は、著者の過去記事（「大豆製品は身長に悪いか」「公費請求で悩んだら」など）。
# 箇条書きの「結論/根拠/注意」ではなく、導入 → 節ごとに段落で説明 → 「結局、〜か」→ 参考 の読み物にする。
# 2026-10-23 第1回（HD患者の補正Ca）で「読み物的ではない」「出典が少ない」とのことで、この形に変更。
# 自由に書き換えてOK。

name: じぶんの薬局
magazine: ギモン深堀り

editorial_policy: |
  日常診療で出た疑問を1つ取り上げ、添付文書・ガイドライン・論文・行政資料をもとに、読み物として整理するマガジン。
  背景や仕組みから説明し、数値・推奨・例外へと順に読み進められるようにする。
  事実は資料に書いてあることだけ。資料で答えが出なかったことは「分からなかったこと」として正直に書く。
  個別の患者への判断はしない。

voice:
  register: です・ます体。だ・である は使わない。
  endings:
    - ×「推奨されている。」→ ○「推奨されています。」
    - ×「〜である。」→ ○「〜です。」
    - ×「報告がある。」→ ○「報告があります。」
  flow: |
    段落の中は、文と文をつなげて読ませる。
    「まず整理しておきたいのが〜です」「つまり〜」「一方で〜」「ただ、〜」「では、〜はどうでしょうか」のような
    つなぎの言葉や問いかけを使ってよい。
    資料名は本文の中で出す（「日本透析医学会のガイドライン（2025年版）では〜」「添付文書の『用法及び用量に関連する注意』には〜」）。
  content: 事実は資料にあることだけ。推測・推奨・感想は書かない（「〜かと思います」「〜と考えられます」は禁止）。
  forbidden_phrases: [かと思います, と考えられます, が期待されます, 注目されます, 注目されています, が大切になります, が重要となります, が求められます, が大切です, が勧められます, ことが重要です, 画期的, 必見, 朗報, 結論から言うと, まとめてみた, いかがでしたか, 安心です, 問題ありません]

sentences:
  max_chars: 80
  notation: |
    - 数値と単位は半角（5mg、CrCl 30mL/min、HR 0.72）。範囲は「5〜10mg」。
    - 薬は「一般名（商品名）」。2回目以降は一般名のみ。
    - 論文は「著者 et al. 誌名. 年;巻:頁.」、添付文書は「〇〇 添付文書（2026年4月改訂 第3版）」の形。
    - 適応外の内容は「適応外」と明記する。
    - 『』・絵文字・「→」・感嘆符は使わない。補足は「※」。

# 1節の型（小見出し → 段落2〜4個 → 必要なら箇条書き → ※出典）
section_block:
  format_example: |
    ## 補正Caは「何を補正しているのか」
    まず整理しておきたいのが、血清Ca値の中身です。血清Caの約4割はアルブミンと結合しており、
    生理的に働くのはイオン化Caです。このため、低アルブミン血症では総Ca値が低く出てしまいます。
    そこで使われるのがPayne式で、「補正Ca＝実測Ca＋（4－Alb）」で計算します。
    日本透析医学会のガイドライン（2025年版）でも、Albが4.0g/dL未満の場合はこの式で補正するよう記載されています。
    ただ、透析患者ではこの式がイオン化Caをうまく反映しない場合があるという報告もあります。
    ※出典：日本透析医学会 CKD-MBD診療ガイドライン（2025年改訂版）／〇〇 et al. 誌名. 2020;35:123.

issue:
  title: "【ギモン深堀り】{title}"
  question_heading: 今回のギモン
  three_lines_heading: この記事のポイント
  unknown_heading: 資料で分からなかったこと
  links_heading: 参考
  afterword_heading: 編集後記
  afterword: "【任意：ご自身で一言。不要ならこの見出しごと削除】"
  max_points: 5

opening_notice:
  heading: この記事について
  body: |
    この記事は、日常診療で出た疑問を、公開資料をもとにAI（NotebookLM 等）が調べてまとめた下書きを、筆者が確認して掲載しています。
    目的は、疑問の答えを一次資料（添付文書・ガイドライン・論文・行政資料）から素早く確かめることです。
    個別の患者さんへの判断を示すものではありません。必ず一次資料をご確認ください。
    また、このマガジンは情報収集の自動化を試す実験の場でもあります。
    誤りや誤謬を見つけて改善していく過程も含めて公開しています。お気づきの点はコメントでお知らせください。

fixed_footer: |
  ※公開情報をもとにAI（NotebookLM 等）で下書きを作成し、筆者が内容を確認したものです。詳細・判断は必ず一次資料（添付文書・ガイドライン・論文原著）でご確認ください。
  ※記事の内容は私の見解であり、薬剤師の助言や指導でないことをご了承ください。医療従事者向けの情報です。
  個人・個別の健康相談については、かかりつけ医、薬剤師にお尋ねください。

podcast:
  enabled: true
  heading: 音声版（AI音声）
  audio_title: ギモン深堀り：{title}（AI音声）
  author: じぶんの薬局（NotebookLM による AI音声）
  cover: assets/onco.png
  body: |
    今回のギモンを音声でまとめたものです。NotebookLM（Google）で自動生成したAI音声で、話者は実在の人物ではありません。
    内容に誤りを含む可能性があります。詳細は一次資料でご確認ください。
  pending: 音声は準備中です（NotebookLM の作成枠が空いたら追加します）。
  instructions: |
    医療従事者向けに、資料（添付文書・ガイドライン・論文・行政資料）だけをもとに、今回の疑問を論点ごとに解説してください。
    資料に無い解釈や推測は話さないでください。資料で答えが出なかった点は、そのとおりに伝えてください。
    個別の患者への判断はしないこと、最後に「詳細は一次資料で確認を」と添えてください。

hashtags:
  fixed: [薬剤師, 病院薬剤師, 医療者向け, ギモン深堀り]
  per_issue: その回の一般名・疾患名・ガイドライン名から4〜7個。合計12個まで

rules:
  must:
    - 事実・数値・用量・推奨は資料に書いてあることだけ。資料に無いことは書かない（「記載なし」とも書かない）。
    - 文末は「〜します」「〜です」「〜ています」。「〜する。」「〜である。」「〜だ。」は使わない。
    - 1文60字前後まで。長くなったら分ける。
    - 各節の sources には、その節で使った資料をすべて入れる。1つの資料だけに頼らず、添付文書・ガイドライン・論文など種類の違う資料を組み合わせる。
    - 本文中の数値・推奨は、どの資料の記載かが分かるように資料名を出す。
    - 資料で答えが出なかった点は、作文せずに unknown に書く。
  never:
    - 推奨・推測・個別の患者への判断（「〜が大切です」「〜が求められます」のような読み手への指示も書かない）。
    - 疑問と関係の薄い分野へ話を広げる（疑問に書かれていない薬・病態の話は入れない）。
    - 筆者の体験談・勤務先・患者の話を作る。

prompt_digest: |
  医療従事者向けの note「ギモン深堀り」の下書きを書く。日常診療で出た疑問を、資料（添付文書・ガイドライン・論文・行政資料）をもとに読み物として整理する。
  【構成】導入の段落 → 論点ごとの節（小見出し＋段落2〜4個） → 「結局、〜か」のまとめ → 参考。
  【書き方】箇条書きの羅列ではなく、段落の文章で読ませる。背景・仕組み → 数値や推奨 → 条件・例外・限界 の順に。
  「まず整理しておきたいのが」「つまり」「一方で」「ただ」「では〜はどうでしょうか」などのつなぎを使ってよい。
  本文の中で資料名を出す（「〇〇学会のガイドライン（2025年版）では」）。
  【文末】必ず です・ます体。だ・である体は禁止。×「推奨されている。」→ ○「推奨されています。」
  【表記】数値・単位は半角、薬は「一般名（商品名）」。適応外は明記。絵文字・「→」・感嘆符は使わない。
  資料に書かれていない事実・数値・用量・推奨は絶対に書かない。推測・推奨・個別の患者への判断はしない。
