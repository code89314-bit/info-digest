# ==== 文体・編集設定：「じぶんの薬局」ギモン深堀り（Discord の疑問深堀チャンネルから） ====
# src/qa_bot.py が prompt_digest（と下の各項目）を NotebookLM / Strata への指示に埋め込みます。
# 書き方の基本は土曜号（style/jibun_yakkyoku.yaml）と同じ。違うのは「1つの疑問を、論点ごとに一次資料で確かめる」こと。
# 自由に書き換えてOK。

name: じぶんの薬局
magazine: ギモン深堀り

editorial_policy: |
  日常診療で出た疑問を1つ取り上げ、添付文書・ガイドライン・論文・行政資料で確かめるマガジン。
  答えは資料に書いてあることだけ。解釈・推奨は入れず、判断は読み手が一次資料で行う前提。
  資料で答えが出なかったことは「分からなかったこと」として正直に書く。
  個別の患者への判断はしない。長い文は嫌われる。端的に書く。

voice:
  register: です・ます体。体言止めも可。だ・である は使わない。
  endings:
    - ×「推奨されている。」→ ○「推奨されています。」
    - ×「〜である。」→ ○「〜です。」
    - ×「報告がある。」→ ○「報告があります。」
  content: ファクトのみ。解釈・感想・推奨・「〜かと思います」「〜と考えられます」は書かない。
  forbidden_phrases: [かと思います, と考えられます, が期待されます, 注目されます, 画期的, 必見, 朗報, 結論から言うと, まとめてみた, いかがでしたか, 安心です, 問題ありません]

sentences:
  max_chars: 40
  notation: |
    - 数値と単位は半角（5mg、CrCl 30mL/min、HR 0.72）。範囲は「5〜10mg」。
    - 薬は「一般名（商品名）」。2回目以降は一般名のみ。
    - 論文は「著者 et al. 誌名. 年;巻:頁.」、添付文書は「〇〇 添付文書（2026年4月改訂 第3版）」の形。
    - 適応外の内容は「適応外」と明記する。
    - 『』・絵文字・「→」・感嘆符は使わない。補足は「※」。

# 1論点の型（結論 → 根拠 → 注意 → 出典）
point_block:
  heading: 小見出し。確かめた論点を短い問いか結論の形で。30字以内。
  lines:
    - label: 結論
      rule: 資料に書かれた答え。1〜2文。
    - label: 根拠
      rule: その答えの根拠（添付文書の項目名、ガイドラインの推奨と推奨度、試験名と数値）。1〜2文。
    - label: 注意
      rule: 任意。条件・例外・適応外・データの限界（資料に書かれているもの）。1〜2文。
    - label: 出典
      rule: 一次資料のリンク。
  format_example: |
    ### 腎機能低下時の減量基準
    **結論**　CrCl 30mL/min 未満では1回量を半量にします。
    **根拠**　添付文書の「用法及び用量に関連する注意」に記載があります。
    **注意**　透析患者のデータはありません。
    **出典**　〇〇 添付文書（2026年4月改訂 第3版）

issue:
  title: "【ギモン深堀り】{title}"
  question_heading: 今回のギモン
  three_lines_heading: 結論（3行）
  points_heading: 深堀り
  unknown_heading: 資料で分からなかったこと
  links_heading: 根拠資料（まとめ）
  afterword_heading: 編集後記
  afterword: "【任意：ご自身で一言。不要ならこの見出しごと削除】"
  max_points: 6

opening_notice:
  heading: この記事について
  body: |
    この記事は、日常診療で出た疑問を、公開資料をもとにAI（NotebookLM 等）が調べてまとめた下書きを、筆者が確認して掲載しています。
    目的は、疑問の答えを一次資料（添付文書・ガイドライン・論文・行政資料）から素早く確かめることです。
    個別の患者さんへの判断を示すものではありません。必ず一次資料をご確認ください。
    また、このマガジンは情報収集の自動化を試す実験の場でもあります。
    誤りや誤謬を見つけて改善していく過程も含めて公開しています。お気づきの点はコメントでお知らせください。

fixed_footer: |
  ※このマガジンは、日常診療の疑問を一次資料で確かめるための「見出し集」です。詳細・判断は必ず一次資料（添付文書・ガイドライン・論文原著）でご確認ください。
  ※公開情報をもとにAI（NotebookLM 等）で下書きを作成し、筆者が内容を確認したものです。
  ※記事の内容は私の見解であり、薬剤師の助言や指導でないことをご了承ください。医療従事者向けの情報です。
  個人・個別の健康相談については、かかりつけ医、薬剤師にお尋ねください。

podcast:
  enabled: true
  heading: 音声版（AI音声）
  audio_title: ギモン深堀り：{title}（AI音声）
  author: じぶんの薬局（NotebookLM による AI音声）
  cover: assets/onco.png
  body: |
    今回のギモンを音声でまとめたものです。NotebookLM（Google）で自動生成したAI音声で、話者は実在の人物ではありません。
    内容に誤りを含む可能性があります。詳細は一次資料でご確認ください。
  # 音声の枠が空くのを待っているあいだ、下書きの音声の節に入れる文（あとで音声に差し替わる）
  pending: 音声は準備中です（NotebookLM の作成枠が空いたら追加します）。
  instructions: |
    医療従事者向けに、資料（添付文書・ガイドライン・論文・行政資料）だけをもとに、今回の疑問を論点ごとに解説してください。
    資料に無い解釈や推測は話さないでください。資料で答えが出なかった点は、そのとおりに伝えてください。
    個別の患者への判断はしないこと、最後に「詳細は一次資料で確認を」と添えてください。

hashtags:
  fixed: [薬剤師, 病院薬剤師, 医療者向け, ギモン深堀り]
  per_issue: その回の一般名・疾患名・ガイドライン名から4〜7個。合計12個まで

rules:
  must:
    - 事実・数値・用量・推奨は資料に書いてあることだけ。資料に無い行は省く（「記載なし」とも書かない）。
    - 文末は「〜します」「〜です」か体言止め。「〜する。」「〜である。」「〜だ。」は使わない。
    - 1文40字以内。超えたら分ける。
    - すべての論点に出典を付ける。
    - 資料で答えが出なかった点は、作文せずに unknown に書く。
  never:
    - 解釈・評価・推奨・推測・個別の患者への判断。
    - 筆者の体験談・勤務先・患者の話を作る。

prompt_digest: |
  医療従事者向けの「ギモン深堀り」の下書きを書く。日常診療で出た疑問を、資料（添付文書・ガイドライン・論文・行政資料）で確かめる。
  【書き方】ファクトのみ。解釈・評価・推奨・推測は書かない（「〜と考えられます」などは禁止）。1文40字以内、1文1事実。
  【文末】必ず です・ます体 か 体言止め。だ・である体は禁止。×「推奨されている。」→ ○「推奨されています。」
  【1論点の型】小見出し（30字以内）の下に、ラベル付きの行で：
  「結論」資料に書かれた答え／「根拠」添付文書の項目名・ガイドラインの推奨と推奨度・試験名と数値／「注意」条件・例外・適応外・データの限界（任意）／「出典」資料のリンク。
  資料に無い行は省く。資料で答えが出なかった点は作文せず「分からなかったこと」に書く。
  【表記】数値・単位は半角、薬は「一般名（商品名）」。適応外は明記。絵文字・「→」・感嘆符は使わない。
  資料に書かれていない事実・数値・用量・推奨は絶対に書かない。個別の患者への判断はしない。
