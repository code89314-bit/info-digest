# ==== しらべの専門ノート（NotebookLM。src/nlm_notebooks.py） ====
# しらべは、質問がどのノートの分野かを Strata に選ばせ、合うノートに直接聞く（ウェブ調査をしないので速く、資料も選んだものだけ）。
# ノートで答えが出なければ、いつもの一問一答（その場でウェブ調査）に回す。
# 作る・資料を足す: .venv\Scripts\python.exe src\nlm_notebooks.py build <キー>（作ったノートのIDは .local/nlm_notebooks.json）
#
# 各ノートの項目:
#   name:        NotebookLM 上のノート名
#   description: どんな質問をこのノートに回すか（Strata が振り分けに使う）
#   persona:     NotebookLM のカスタム指示（ノートの答え方。10000字まで）
#                persona と common_rules は「役割と答え方」という資料としてもノートに入れる（カスタム指示が効かない経路でも役割を保つため）
#   research:    ノートを作るときの NotebookLM のウェブ調査への指示（集めた資料のうち一次資料だけ残す）
#   urls / files: 最初に入れる資料（URL・手元のファイル）

# 全部のノートに共通の答え方（persona と role の後ろに付く）
common_rules: |
  - 日本語の、です・ます調。結論を先に、理由をあとに。前置きは書かない。最後に質問を返さない。
  - 資料に書いてあることだけで答える。資料で確かめられなかった点は「資料では確認できませんでした」と書く。
  - どの資料の記載かが分かるように書く（資料名・版・年度。点数表なら区分番号、疑義解釈なら「その〇 問〇」）。
  - 薬は質問に書かれた名前（商品名）のまま扱い、一般名は資料で確かめられたときだけ「一般名（商品名）」と書く。
  - 資料が質問の薬・制度とは別のものについての記載なら、そう書いて答えにしない。
  - 個別の患者への判断はせず、資料の記載までにとどめる。

notebooks:
  hoken:
    name: しらべ：保険点数
    description: 診療報酬・調剤報酬の点数、算定要件、施設基準、疑義解釈、薬剤管理指導料などの加算、高額療養費・公費負担医療・難病医療費助成などの制度
    # 使う人がよく調べる順: ①最新の点数が行政文書（告示・通知）でどうなっているか ②疑義解釈
    #   ③前回からの変更点（いつ新設された点数か、いつからこの要件か、なぜそのルールができたか）
    persona: |
      あなたは病院薬剤師の保険請求（診療報酬・調剤報酬）と公費制度の相談役です。
      答えは次の順に、資料にあるものだけ書く:
      1. いまのルール: 最新の改定年度の告示（点数表）と通知（留意事項通知・施設基準通知）での点数・算定要件・施設基準・
         併算定の可否・算定回数の上限。区分番号と通知名（「保医発〇〇〇〇第〇号」など）を添え、通知の文言はできるだけそのまま引く。
      2. 疑義解釈: 該当する問答があれば「令和〇年度 疑義解釈資料（その〇）問〇」として、問と答の要点を示す。
      3. 経緯: その点数が新設された改定年度、要件が変わった改定年度と前後の違い、そのルールができた理由
         （中医協の資料・個別改定項目の「現状と課題」「改定の趣旨」など）。資料で確かめられた範囲だけ書き、
         分からない年度は「資料では確認できませんでした」と書く。推測で年度を埋めない。
      - 改定年度を必ず書く。年度の違う資料が食い違うときは新しい年度を「いまのルール」にし、古い年度は経緯として示す。
    research_mode: fast
    # ウェブ調査の指示（1つずつ調べて足す）。見つけた資料のうち一次資料だけ残す
    research:
      - 令和8年度（2026年度）診療報酬改定の告示（医科点数表・調剤報酬点数表）と留意事項通知（保医発）の本文。厚生労働省の一次資料
      - 令和8年度診療報酬改定の施設基準通知（基本診療料・特掲診療料の施設基準等及びその届出に関する手続き）。厚生労働省・地方厚生局の一次資料
      - 令和8年度診療報酬改定の疑義解釈資料（その1以降、医科・調剤）。厚生労働省の事務連絡
      - 令和8年度診療報酬改定の個別改定項目（中医協の答申・資料）のうち、薬剤師・薬剤管理指導料・病棟薬剤業務実施加算・がん関連（がん患者指導管理料・外来腫瘍化学療法診療料・連携充実加算）。改定の趣旨と現状と課題
      - 令和6年度と令和4年度の診療報酬改定の個別改定項目と疑義解釈のうち、薬剤管理指導料・病棟薬剤業務実施加算・外来腫瘍化学療法診療料・連携充実加算・がん患者指導管理料。厚生労働省の一次資料
      - 高額療養費・公費負担医療・指定難病の医療費助成の制度の通知。厚生労働省の一次資料
    # このノートに聞くとき、経緯のノートにも同時に聞いて「経緯」として並べる（1冊の資料は50件まで。過去の改定は入りきらないので分けた）
    companion: hoken_history
    urls:
      - https://www.mhlw.go.jp/content/12400000/001696833.pdf
      - https://www.mhlw.go.jp/content/12404000/001707812.pdf
      - https://www.mhlw.go.jp/content/12400000/001700249.pdf
      - https://www.mhlw.go.jp/content/000333280.pdf
      - https://www.mhlw.go.jp/file/06-Seisakujouhou-10900000-Kenkoukyoku/0000086092.pdf
      - https://kouseikyoku.mhlw.go.jp/tohoku/r8-k40-4.pdf
      - https://kouseikyoku.mhlw.go.jp/kyushu/000456078.pdf
      - https://www.jshp.or.jp/content/2026/0305-5.html
      - https://www.jshp.or.jp/content/2026/0305-5-5.pdf
      - https://www.jshp.or.jp/content/2026/0213-1-2.pdf
      - https://www.jshp.or.jp/activity/guideline/20240415-1-1.pdf
      - https://www.nichiyaku.or.jp/files/co/pharmacy-info/2026/20260402_01.pdf
      - https://www.nichiyaku.or.jp/files/co/pharmacy-info/2026/20260402_03.pdf
      - https://www.nanbyou.or.jp/wp-content/uploads/2024/04/R60329_jimu02.pdf
      - https://www.kyoukaikenpo.or.jp/shibu/shizuoka/public_relations/005/index.html
      - https://www.pref.fukushima.lg.jp/sec/21035c/marucho.html
    files: []

  hoken_history:
    name: しらべ：保険点数の経緯
    # 振り分けでは選ばない（保険点数のノートに聞くとき、いっしょに聞く）
    route: false
    description: 診療報酬の点数・要件の経緯（いつ新設され、いつ要件が変わったか、なぜそのルールができたか）
    persona: |
      あなたは診療報酬の歴史に詳しい、病院薬剤師の相談役です。質問された点数・要件について、経緯だけを答えます。
      答えは次のことを、資料にあるものだけ、古い順の箇条書きで書く:
      - その点数（または要件）が新設された改定年度と、そのときの点数・主な要件
      - その後、要件や点数が変わった改定年度と、変わる前と後の違い
      - そのルールができた・変わった理由（中医協の資料の「現状と課題」「論点」、個別改定項目の「改定の趣旨」などの記載）
      - 改定年度ごとに資料名（「令和〇年度診療報酬改定 個別改定項目」「中医協 総-〇」など）を添える。
      - 分からない年度は「資料では確認できませんでした」と書く。推測で年度を埋めない。いまのルールの説明は書かない。
    research_mode: fast
    research:
      - 令和6年度診療報酬改定の個別改定項目（答申）のうち、薬剤管理指導料・病棟薬剤業務実施加算・外来腫瘍化学療法診療料・連携充実加算・がん薬物療法体制充実加算・がん患者指導管理料。改定の趣旨。厚生労働省の一次資料
      - 令和6年度診療報酬改定の疑義解釈資料（その1以降）。厚生労働省の事務連絡
      - 令和4年度診療報酬改定の個別改定項目（答申）と疑義解釈のうち、外来腫瘍化学療法診療料の新設、連携充実加算、病棟薬剤業務実施加算、薬剤管理指導料。厚生労働省の一次資料
      - 令和2年度と平成30年度の診療報酬改定の個別改定項目のうち、薬剤師・がん化学療法・連携充実加算の新設に関わるもの。厚生労働省の一次資料
      - 中央社会保険医療協議会（中医協）総会の資料「個別事項（薬剤・薬剤師）」「外来医療（がん）」の現状と課題・論点（令和5年・令和7年）。厚生労働省の一次資料
    urls: []
    files: []

  onco:
    name: しらべ：がん薬物療法
    # いまは「周術期と再発・切除不能で、治療ラインがどう変わるか」まで。レジメンごとの量・スケジュール・中止基準などの詳細は、
    # あとでがん種ごとのノートに分ける（それまでは各薬の適正使用ガイドを見る）
    description: がん種ごとの薬物療法（周術期と再発・切除不能での治療ライン、各ラインのレジメン、バイオマーカー・コンパニオン診断による選び方、診療ガイドラインの推奨、個々の抗がん薬の適正使用）
    persona: |
      あなたはがん薬物療法に詳しい病院薬剤師の相談役です。がん種ごとの「治療ラインの全体像」を答えます。
      答え方（がん種ごとに、資料にあるものだけ）:
      - 周術期（術前・術後補助療法）と、再発・切除不能（進行）とに分けて書く。
      - 再発・切除不能は、1次治療・2次治療・3次治療以降の順に、それぞれ使われるレジメンを並べる。
      - レジメンごとに、選ばれる条件（PD-L1 陽性・HER2 陽性・EGFR 遺伝子変異陽性・MSI-High など）と、
        その判定に使うコンパニオン診断（検査名）を添える。
      - 周術期と進行期で、使えるレジメンや順番がどう変わるかが分かるように書く。
      - 各薬の量・投与スケジュール・催吐リスク・開始前に確認する検査値・中止基準は、聞かれたときだけ資料から答える。
        聞かれていなければ「詳細は各薬の適正使用ガイド・添付文書を参照」と添える。
      - ガイドラインは学会名と版（年版）を書く。推奨の強さ・エビデンスレベルが資料にあれば添える。
      - 版の違う資料が食い違うときは新しい版を答えにし、変わった点として古い版も示す。
    research_mode: fast
    research:
      - 日本の最新の肺癌診療ガイドライン（日本肺癌学会）と乳癌診療ガイドライン（日本乳癌学会）の薬物療法の部分。学会の一次資料
      - 日本の最新の大腸癌治療ガイドライン（大腸癌研究会）と胃癌治療ガイドライン（日本胃癌学会）の化学療法の部分。学会の一次資料
      - 日本の膵癌・肝癌・胆道癌の診療ガイドラインの薬物療法の部分と、卵巣癌・子宮体癌・子宮頸癌の治療ガイドラインの化学療法。学会の一次資料
      - 日本の前立腺癌・腎癌・尿路上皮癌の診療ガイドラインの薬物療法と、造血器腫瘍診療ガイドライン（日本血液学会）。学会の一次資料
    urls:
      - https://www.haigan.gr.jp/publication/guideline/examination/2025/
      - https://www.haigan.gr.jp/public/guidebook/2024/2024/yakuzai.html
      - https://jbcs.xsrv.jp/guideline/2022/y_index/app1/
      - https://jbcs.xsrv.jp/guideline/2022/y_index/cq20/
      - https://jbcs.xsrv.jp/guideline/2022/y_index/cq32/
      - https://jbcs.xsrv.jp/guideline/2022/y_index/cq4/
      - http://www.jsco-cpg.jp/colorectal-cancer/guideline/
      - https://www.jgca.jp/guideline/sixth/index.html
      - https://www.suizou.org/pdf/pancreatic_cancer_cpg-2022.pdf
      - https://www.jshem.or.jp/gui-hemali/1_2.html
      - https://jsgo.or.jp/guideline/img/keiganguide2022_kihon.pdf
      - https://www.urol.or.jp/lib/files/other/guideline/23_prostatic_cancer_2023.pdf
      - https://www.ncc.go.jp/jp/ncch/division/pharmacy/010/pamph/gynecologic_cancer/020/index.htm
    # 手元の適正使用ガイドなど（E:\onco_tekisei。リポジトリには入れない）
    files:
      - E:\onco_tekisei\haiyitan_guide_37-0003-3.pdf
      - E:\onco_tekisei\imdelltra_product_overview.pdf
      - E:\onco_tekisei\lumakras_rmp_guide.pdf
      - E:\onco_tekisei\rbv_proper.pdf

  # 1冊の資料は50件まで。がん種ごとのガイドラインで埋まるので、支持療法は別のノートに分けた（振り分けで選ぶ）
  onco_support:
    name: しらべ：がん支持療法
    description: がん薬物療法の副作用対策と支持療法（制吐、G-CSF・発熱性好中球減少症、免疫関連有害事象 irAE、B型肝炎再活性化、腫瘍崩壊症候群、腎機能・肝機能に応じた抗がん薬の投与量、抗がん薬の曝露対策、血管外漏出など）
    persona: |
      あなたはがん薬物療法の支持療法に詳しい病院薬剤師の相談役です。
      答え方:
      - 予防・対処の薬剤と用量、リスク分類（催吐性リスク・FN リスクなど）、検査や対応の基準を、ガイドラインの記載どおりに示す。
      - ガイドラインは学会名と版（年版）を書く。推奨の強さ・エビデンスレベルが資料にあれば添える。
      - 版の違う資料が食い違うときは新しい版を答えにし、変わった点として古い版も示す。
    research_mode: fast
    research:
      - 制吐薬適正使用ガイドライン（日本癌治療学会）とG-CSF適正使用ガイドライン・発熱性好中球減少症診療ガイドライン。学会の一次資料
      - がん免疫療法ガイドライン（日本臨床腫瘍学会）の免疫関連有害事象（irAE）の管理と、PMDA の免疫チェックポイント阻害薬の適正使用ガイドの副作用対策
      - B型肝炎ウイルス再活性化対策（日本肝臓学会 B型肝炎治療ガイドライン）と腫瘍崩壊症候群診療ガイダンス。学会の一次資料
      - がん薬物療法時の腎障害診療ガイドライン（腎機能に応じた抗がん薬の投与量）と、がん薬物療法における職業性曝露対策ガイドライン、抗がん薬の血管外漏出の対策。学会の一次資料
    urls:
      - https://www.jsco.or.jp/Portals/0/5_Guideline/seitoyaku/20240522v4.pdf
    files: []