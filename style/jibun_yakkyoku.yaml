# ==== 文体・編集設定：「じぶんの薬局」週刊がん薬物療法ニュース ====
# note「じぶんの薬局」（https://note.com/code89314）の週刊マガジンの下書きを作るための設定です。
# src/note_weekly.py が prompt_digest（と下の各項目）を NotebookLM / Strata への指示に埋め込みます。
# 事実は「資料（今週の記事）」から、書き方はこのファイルから。過去記事そのものは資料に入れません。
#
# 作り方（2026-10-21）
#   1) 著者の過去記事9本から、表記・注意書き・出典の書き方を抽出
#   2) 著者の編集方針（下の editorial_policy）を最優先で反映
#   3) note で医療者向けに読まれている記事を調査し、構成に反映（下の reference_trends）
# 自由に書き換えてOK。

name: じぶんの薬局
magazine: 週刊がん薬物療法ニュース

# ---------------------------------------------------------------
# 0. 編集方針（著者の言葉。すべての項目より優先）
# ---------------------------------------------------------------
editorial_policy: |
  忙しい日常診療の合間に、素早くトピックスをキャッチアップするためのマガジン。
  学術的な内容や掘り下げは、元の論文・ガイドラインなどの一次資料に当たるのが鉄則。読み手にもその気持ちでいてもらう。
  だから解釈めいたものはあえて入れない。「結論 → これまで → これから」の順に、ファクトのみを書く。
  長い文は嫌われる。端的に書く。

# ---------------------------------------------------------------
# 1. 書き方
# ---------------------------------------------------------------
voice:
  register: です・ます体。体言止めも可（「〜を承認。」「〜に改訂。」）。だ・である は使わない。
  # 2026-10-21 第0号で「〜を承認した。」「〜である。」が多発したため、文末の言い換え例を明示
  endings:
    - ×「承認した。」→ ○「承認しました。」または「承認。」
    - ×「〜である。」→ ○「〜です。」
    - ×「進行中である。」→ ○「進行中です。」
    - ×「行われていた。」「施行されていた。」→ ○「〜でした。」
    - ×「〜となった。」→ ○「〜となりました。」
  content: ファクトのみ。解釈・感想・推奨・「〜かと思います」「〜が期待されます」「〜と考えられます」は書かない。
  person: 一人称・読者への呼びかけは本文に出さない（冒頭のあいさつ1文と編集後記だけ可）。
  forbidden_phrases: [かと思います, と考えられます, が期待されます, 期待が高まります, 注目されます, 画期的, 衝撃, 革命的, 必見, 朗報, 待望の, ゲームチェンジャー, 結論から言うと, まとめてみた, いかがでしたか]

sentences:
  max_chars: 40          # 1文の上限。超えたら2文に分ける
  target_chars: 25-35
  one_fact_per_sentence: true
  paragraph: 1〜2文。トピック内は空行で区切らず、ラベル付きの行で区切る（下の topic_block）
  notation: |
    - 数値と単位は半角（5mg、28時間、HR 0.72、OS中央値 12.3カ月）。範囲は「5〜10mg」。
    - 括弧は全角（）。薬は「一般名（商品名）」。2回目以降は一般名のみ。
    - 日付は「2026年10月20日」または「10/20」。承認・施行・収載の日は必ず書く（資料にあれば）。
    - 略語は初出だけ括弧で正式名（例：ADC（抗体薬物複合体））。医療者向けの基本略語（OS、PFS、HR、ICI）は説明不要。
    - 「」は製品名・用語・引用だけ。『』・絵文字・「→」・感嘆符は使わない。補足は「※」。

# ---------------------------------------------------------------
# 2. 1トピックの型（結論 → これまで → これから）
# ---------------------------------------------------------------
topic_block:
  heading: |
    小見出し（note の「小見出し」）。結論をそのまま短く。30字以内。
    例「ペムブロリズマブ、〇〇がんの術前・術後に適応追加」「制吐療法GL 2026年版、オランザピンの推奨を変更」
  lines:
    - label: 結論
      rule: 何が決まった・分かったか。1〜2文。主語・機関・日付を入れる。
    - label: これまで
      rule: 変わる前の状態（従来の標準・旧版の推奨・既存の適応）。1〜2文。資料に無ければ行ごと省く。
    - label: これから
      rule: 決まっている次の予定・変更点の事実だけ（施行日、薬価収載予定、国内申請の有無、改訂の適用開始、試験の次の段階）。1〜2文。資料に無ければ行ごと省く。予想は書かない。
    - label: データ
      rule: 任意。試験名・対象・比較・主要評価項目の結果（数値）。1行。数値は資料にあるものだけ。
    - label: 出典
      rule: 一次情報のリンク（PMDA・厚労省・学会・論文・メーカー発表）。論文は「Bajpai J, et al. Lancet Oncol. 2024;25:246-254.」の形。報道しか無ければ報道元を書き、結論の文末に「（報道）」。
  format_example: |
    ### オランザピン、制吐目的は2.5mgでも有効
    **結論**　2.5mgと10mgの比較試験で、2.5mgの非劣性が示されました。
    **これまで**　添付文書の用量は1日5〜10mgです。
    **データ**　第3相・非劣性試験。
    **出典**　Bajpai J, et al. Lancet Oncol. 2024;25:246-254.
  length: 80〜180字（出典を除く）。最大250字。
  special_rules:
    - 海外の承認は小見出しに「【海外】」、本文に「海外（FDA）」と書く。国内承認と混同させない。
    - 治験・試験段階は結論に「第3相」「第2相」などの段階を書く。「有効」と言い切らず、主要評価項目の達成として書く。
    - 適応外の内容は「適応外」と明記する。
    - 安全性情報（添付文書改訂・副作用）は、改訂された項目名（「重大な副作用」など）と追加された内容を書く。
    - 出来事が今週より前（今週に報じられた過去の承認・発表など）なら、結論に日付を必ず書く（例「8/26に承認しました（今週報道）。」）。
    - 「これまで」は資料に書かれた具体的な前の状態だけ。「これまでは標準治療が行われていました」のような一般論なら行ごと省く。

# ---------------------------------------------------------------
# 3. 週刊号の構成
# ---------------------------------------------------------------
issue:
  title: "【週刊がん薬物療法】{start:%-m/%-d}〜{end:%-m/%-d}｜{headline_1}、{headline_2} ほか"
  title_rule: |
    {headline_1}{headline_2} はその週の重要トピック2つを、それぞれ15字以内の名詞句で。
    号数で埋もれないよう、タイトル前半は固定（シリーズとして認識される）、後半で中身を見せる。
  sections:
    - id: lead
      body: |
        あいさつ1文（固定文：「今週（{start:%-m/%-d}〜{end:%-m/%-d}）のがん薬物療法の主な動きです。」）。
        続けて「今週の3行」：最重要トピック3つを各30字以内の箇条書きで。忙しい人はここだけ読めば済む状態にする。
        続けて note の「目次」を入れる。
    - id: themes
      heading_level: 大見出し（note の「見出し」）
      order: [新薬・承認, 治療ストラテジー（臨床試験）, ガイドライン, 治験, 安全性・行政]
      body: 各テーマに topic_block を1〜4件。重要な順。記事の無いテーマは見出しごと省く。
    - id: links
      heading: 一次資料リンク（まとめ）
      body: 今号の出典を一覧で（掘り下げは一次資料で、という方針を形にする）。トピックの小見出し＋URLを1行ずつ。
    - id: afterword
      heading: 編集後記
      optional: true
      body: "【任意：ご自身で一言。不要ならこの見出しごと削除】 AIは書かない。"
    - id: footer
      body: fixed_footer をそのまま
  total_length: 1500〜3500字（調査では、読まれている医療者向け記事は900〜2000字・1トピック100〜200字。1万字超の羅列型は読まれていない）
  max_topics: 12

fixed_footer: |
  ※このマガジンは、忙しい合間に動きをつかむための「見出し集」です。詳細・判断は必ず一次資料（添付文書・ガイドライン・論文原著）でご確認ください。
  ※公開情報をもとにAI（NotebookLM 等）で下書きを作成し、筆者が内容を確認したものです。
  ※記事の内容は私の見解であり、薬剤師の助言や指導でないことをご了承ください。医療従事者向けの情報です。
  個人・個別の健康相談については、かかりつけ医、薬剤師にお尋ねください。

# その週の podcast（土曜の週間まとめで NotebookLM が作った音声）を、記事の最後（注意書きの前）に貼る
# note の「音声データの埋め込み」（MP3・最大100MB）を使う。下書きには位置メモと説明文だけ入れる
podcast:
  enabled: true
  heading: 今週の音声版（AI音声）
  body: |
    今週のトピックを音声でまとめたものです。NotebookLM（Google）で自動生成したAI音声で、話者は実在の人物ではありません。
    内容に誤りを含む可能性があります。詳細は一次資料でご確認ください。

hashtags:
  fixed: [がん薬物療法, 抗がん剤, 薬剤師, がん専門薬剤師, 病院薬剤師, 医療ニュース, 新薬]
  per_issue: その号の一般名・がん種・学会名（ASCO / ESMO 等）・ガイドライン名から5〜8個。合計15個まで

# ---------------------------------------------------------------
# 4. 守ること
# ---------------------------------------------------------------
rules:
  must:
    - 事実・数値・日付・承認状況は資料に書いてあることだけ。資料に無い行は省く（「記載なし」「不明」とも書かない）。
    - 文末は「〜しました」「〜です」か体言止め。「〜した。」「〜である。」「〜だ。」は使わない。
    - 今週より前の出来事は、結論に日付を書く。
    - 1文40字以内。超えたら分ける。
    - すべてのトピックに出典を付ける。
  never:
    - 解釈・評価・推奨・予想・現場への提言（例「〜の確認が必要になりそうです」）。
    - 筆者の体験談・勤務先の話を作る。
    - 記事本文の長い引用・言い換えだけの要約（ファクトを抜き出して短く書き直す）。
    - 特定の製品を宣伝する書き方。

# ---------------------------------------------------------------
# 5. 参考にしたnoteの傾向（2026-10-21 調査。note内検索「がん薬物療法」「ASCO」「ESMO」「添付文書改訂」「今週の注目論文」など）
# ---------------------------------------------------------------
reference_trends:
  summary: |
    医療者向けの専門記事は、スキ10〜35が中心（読者は少数でも熱心）。スキが集まるのは次の型。
  adopted:
    - 結論を最初の1〜2文に置き、背景は後（ASCO 2024 STEP試験の解説記事など）。→ 1トピックを「結論」から始める
    - 学会・トピックごとに小見出しを立て、1トピック1段落100〜200字（ASCO 2026 乳がんトピックス、約1,900字）→ 小見出し＋短い本文
    - 目次機能で全体を見せる → 冒頭に目次
    - 出典を明示する【出典・参照】ブロック、AI翻訳・AI作成の注記を入れる記事が増えている → 出典行と固定の注意書き
    - 連載記号で回を認識させる（【泌尿器がん③】、今週の注目論文（日付））→ タイトル前半を固定
    - 中身が見えるタイトル（学会名＋がん種＋結論）→ タイトル後半に今週の重要トピック2つ
    - 病院薬剤師がAI（NotebookLM）で添付文書改訂を要約する記事にも反応がある → AI利用を隠さず明記してよい
  avoided:
    - 論文タイトルを数十本並べるだけの長文（1〜2万字・見出し無し）は、継続していてもスキが伸びない
    - 煽りタイトル（「絶望」「衝撃」「副作用ゼロ？」）はスキは集まるが、方針（ファクトのみ）と信頼性に合わない
    - 絵文字見出し

# ---------------------------------------------------------------
# 6. NotebookLM / Strata に渡す圧縮版（note_weekly.py はこれを指示の先頭に付ける）
# ---------------------------------------------------------------
prompt_digest: |
  医療従事者向けの「週刊がん薬物療法ニュース」の下書きを書く。目的は、忙しい診療の合間に動きを素早くつかむこと。掘り下げは一次資料で行う前提。
  【書き方】ファクトのみ。解釈・評価・推奨・予想・感想は書かない（「〜かと思います」「〜が期待されます」「画期的」などは禁止）。1文40字以内、1文1事実。
  【文末】必ず です・ます体 か 体言止め。だ・である体は禁止。
  ×「FDAが〇〇を承認した。」→ ○「FDAが〇〇を承認しました。」/「FDAが〇〇を承認。」
  ×「対象は△△である。」→ ○「対象は△△です。」　×「試験が進行中である。」→ ○「試験が進行中です。」
  【日付】今週より前の出来事（今週報じられた過去の承認など）は、結論に日付を書く（例「8/26に承認しました。」）。
  【1トピックの型】小見出し（結論そのまま、30字以内）の下に、ラベル付きの行で：
  「結論」何が決まった・分かったか（主語・機関・日付）／「これまで」資料に書かれた変わる前の具体的な状態（一般論なら省く）／「これから」決まっている次の予定（施行日・収載予定など）／「データ」試験名・対象・主要評価項目の数値（任意）／「出典」一次情報のリンク。
  資料に無い行は省く（「記載なし」とも書かない）。80〜180字。
  【表記】数値・単位は半角、括弧は全角、薬は「一般名（商品名）」。海外承認は小見出しに【海外】、本文に「海外（FDA）」。試験は「第3相」など段階を書く。適応外は明記。絵文字・「→」・感嘆符は使わない。
  資料に書かれていない事実・数値・日付・承認状況は絶対に書かない。
