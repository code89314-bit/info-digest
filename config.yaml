      - name: JAXA 宇宙科学研究所のイベント
        type: page
        url: https://www.isas.jaxa.jp/outreach/events/
      # 相模原住宅公園（中央区中央4-1）は公式ページにイベントの本文が無いので、ニュース検索で（検索語: 相模原住宅公園）
