  # ---- 沿線の情報の欄（src/local_events.py）。株式の欄の次に1つ付きます（問い合わせが1回増える） ----
  # 申込が要るイベント・イベント・新しいお店を見出しから拾い、日付・締切を覚えておいて、近づいたら「⏰ もうすぐ」で毎朝知らせます。
  # 見つけたものは .local/state/local_events.json（手で消してもよい）。日付は見出しに書いてあるものだけ
  local:
    enabled: true
    title: 📍 横浜線沿線（町田〜橋本）
    audience: JR横浜線の町田〜橋本の沿線に住む社会人。週末の予定や、申込の締切を忘れたくない
    area: >-
      JR横浜線の町田駅〜橋本駅の沿線（町田市、相模原市の中央区・南区・緑区の橋本周辺。駅は町田・古淵・淵野辺・矢部・相模原・橋本。
      南町田・相模大野・多摩境も近いので含める）
    # 地域の外でも知らせてほしいもの（全国の抽選・エントリーなど）
    extra: |
      全国でも: スターバックスの福袋の抽選販売・エントリーだけ（受付の開始日と締切を拾う。福袋以外のキャンペーン・新商品は選ばない）
    exclude: >-
      プロスポーツの試合の告知（SC相模原・FC町田ゼルビアの試合や、相手チームの記事）、事件・事故、求人・職員募集、選挙、
      行政の計画・会議・統計、企業の決算、すでに終わったイベントの報告、全国のポイント還元・キャッシュレス決済のキャンペーン
    lookback_days: 7          # 何日前までの見出しを見るか（イベントは数週間前に告知されるので長め）
    remind_days: 7            # 締切・開催日の何日前から「⏰ もうすぐ」に出すか
    # 受付中・開催中のまとめ（申込・イベントのうち、まだ終わっていないもの全部）。別のチャンネルに毎朝作り直す
    # （前の回は消すので、そのチャンネルにはいつも最新の1回分だけ）。投稿は Bot（DISCORD_BOT_TOKEN）で、
    # 投稿先のチャンネルIDは .env の DISCORD_LOCAL_CHANNEL_ID（いまは「イベント」チャンネル）
    summary:
      enabled: true
      channel_env: DISCORD_LOCAL_CHANNEL_ID
      title: 受付中・開催中のまとめ
    # 1日に新しく載せる最大数（分類ごと。日付の近い順。あふれたものも覚えておき、近づいたら「⏰ もうすぐ」に出す）
    max_per_kind: {entry: 10, event: 15, opening: 8}
    max_headlines: 250        # LLM に見せる見出しの最大数
    batch: 50                 # 1回の問い合わせで読ませる見出しの数（多すぎると先頭からしか選ばない）
    max_items_per_batch: 15   # 1回の問い合わせで選ばせる最大数
    max_chars: 3800           # 欄の長さの上限（Discord の欄の上限は4096字。Googleニュースのリンクは1本250字ほど）
    skip_titles: ["求人", "アルバイト", "中古", "賃貸", "不動産"]
    # 取りこぼしたくないサイト（毎朝直接読む。ここから拾ったものは件数の枠に関係なく 📌 付きで載せる）
    #   type: rss    … 新しい記事をすべて選別に回す（Googleニュースの検索RSSも使える）
