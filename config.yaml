# ==== 設定ファイル（ここを編集すれば挙動を変えられます） ====

earthquake:
  # 投稿する最小震度  10=1, 20=2, 30=3, 40=4, 45=5弱, 50=5強, 55=6弱, 60=6強, 70=7
  min_scale: 30
  # 津波予報（警報・注意報）を投稿するか
  tsunami: true

drug_supply:
  # 各区分で一覧表示する最大件数（超えた分は「ほか○件」）
  max_items_per_section: 25
  # 気になる成分名・品名（部分一致）。該当すると⭐で別枠表示されます
  watchlist:
    # - アモキシシリン
    # - カルボシステイン
    # - トラネキサム酸

ai_digest:
  # Discordに表示する名前
  title: ローカルAIダイジェスト
  # Discord に表示するアイコン（assets/ai.png。作り直すときは scripts/make_icons.py）
  avatar_url: https://raw.githubusercontent.com/code89314-bit/info-digest/main/assets/ai.png?v=1
  # Claude API のモデル（下の llm.provider を anthropic にしたときだけ使用。ANTHROPIC_API_KEY が必要）
  model: claude-haiku-5-5

  # ---- 記事の選別・要約に使うLLM ----
  # LLMが使えないとき（サーバー停止中・エラー）は、fallback_keywords に一致した記事の見出しだけを投稿します
  llm:
    # openai_compat = 自宅のローカルLLMサーバー / anthropic = Claude API / none = LLMを使わない
    provider: openai_compat
    # ローカルLLMサーバーのアドレス（末尾は /v1）。いまは同じPCの Strata。
    # 例: Ollama http://localhost:11434/v1 、LM Studio http://localhost:1234/v1
    base_url: http://127.0.0.1:8080/v1
    # サーバーで動いているモデル名（Strata は strata launch の表示、Ollama は ollama list で確認）
    # 2026-10-30 に Qwen3.8-Flash-Next Q2_0 から Qwen3.6-35B-A3B（プリセット「Qwen36 32K」）へ切り替え。
    # モデル全体がメモリに収まるので約8倍速い（ニュース25件の選別 240秒 → 30秒）
    model: qwen3.6-35b-a3b-ud-q4_k_xl
    # APIキーを入れる環境変数の名前（キーの値そのものは .env に書く。不要なら空でよい）
    api_key_env: LOCAL_LLM_API_KEY
    # 1回の問い合わせを待つ最大秒数
    timeout: 600
    # 0に近いほど毎回同じような選び方になる
    temperature: 0.2
    # 1回の問い合わせに入れる候補の数。多いとVRAM・文脈長を圧迫するので25件ずつ分けて選ぶ
    batch_size: 25
    # 候補1件あたり、本文の冒頭を何文字までLLMに見せるか
    summary_chars: 200
    # 返答の最大トークン数（考える時間も含む）
    max_tokens: 4000
    # JSON形式での返答をサーバーに要求する（非対応のサーバーなら自動で外して再送）
    json_mode: true
    # 出典は違うが同じ出来事を報じた記事を、最後にLLMで1件にまとめる（問い合わせが1回増える）
    dedupe: true
    # サーバー独自の追加設定（そのままリクエストに付ける）。
    # Strata: reasoning_budget_tokens = 考える量の上限（0で無制限）。
    #         考えさせない場合は reasoning_budget_tokens の代わりに  chat_template_kwargs: {enable_thinking: false}
    extra_body:
      reasoning_budget_tokens: 1024
  # 1回のダイジェストの最大件数
  max_items: 12
  # 何時間前までの記事を対象にするか
  lookback_hours: 36

  # ---- 何を拾うか（LLMへの指示。自由に書き換えてOK） ----
  focus: |
    VRAM 16GB以下のGPU（RTX 4060 Ti 16GB / 4070系など）で動かせる、ローカル実行のAI。
    - ComfyUI：本体のアップデート、新しいモデル対応、カスタムノード、ワークフロー、省VRAM化の手法
    - 画像・動画生成モデル（Flux、SDXL、Wan、HunyuanVideo 等）のうち16GBで動くもの・量子化版（GGUF/FP8/NF4）
    - ローカルLLM：llama.cpp / Ollama / LM Studio、GGUF量子化、16GBに収まるサイズ（〜30B程度の量子化まで）の新モデル
    実際に手元で試した検証記事（速度・VRAM使用量・設定値などの具体的な数字があるもの）を特に優先。
  exclude: |
    クラウド専用・API専用のサービスやモデル、24GB以上のVRAMが前提のもの（量子化して16GBに収まるなら採用）、
    企業の資金調達・経営ニュース、AI規制や政策の話題、一般向けのAI活用ハウツー、
    PC・グラボの販売や宣伝の記事、有料記事・有料サービスの宣伝だけの投稿、自作品の紹介だけの投稿
  interests:
    - 16GB VRAMで動く新モデル
    - ComfyUIの新機能・新ワークフロー
    - 日本語に強いローカルLLM
  # 見出しの分類
  tags: [ComfyUI・画像/動画生成, ローカルLLM, ツール・アップデート, その他]

  # LLMが使えないときの絞り込みキーワード（大文字小文字は区別しない）
  fallback_keywords: [comfyui, gguf, llama.cpp, ollama, lm studio, local, quantiz, vram, flux, wan, ローカル]

  # LLMに見せる候補の最大数（多いほど時間がかかる。90件で約2分）
  max_candidates: 150

  # 日本語の記事だけを対象にする（Zenn・Qiita・noteのタグ別新着、Googleニュースの検索結果）
  sources:
    # note：実際に試した個人の記事が多い（2026-10-30 の実験で採用の大半がここから）
    - name: "note #ComfyUI"
      url: https://note.com/hashtag/ComfyUI/rss
    - name: "note #ローカルLLM"
      url: https://note.com/hashtag/%E3%83%AD%E3%83%BC%E3%82%AB%E3%83%ABLLM/rss
    # Googleニュース：キーワード検索の結果をRSSで受け取る（when:2d = 直近2日）。
    # 検索語は q= の後ろ（URLエンコード済み）。変えるときは news.google.com で検索 → URL の q= をまねる
    - name: "Googleニュース: ローカルLLM"
      url: https://news.google.com/rss/search?q=%E3%83%AD%E3%83%BC%E3%82%AB%E3%83%ABLLM%20OR%20llama.cpp%20OR%20Ollama%20OR%20%22LM%20Studio%22%20OR%20GGUF%20when%3A2d&hl=ja&gl=JP&ceid=JP:ja
    - name: "Zenn #ComfyUI"
      url: https://zenn.dev/topics/comfyui/feed
    - name: "Zenn #StableDiffusion"
      url: https://zenn.dev/topics/stablediffusion/feed
    - name: "Zenn #ローカルLLM"
      url: https://zenn.dev/topics/localllm/feed
    - name: "Zenn #Ollama"
      url: https://zenn.dev/topics/ollama/feed
    - name: "Zenn #llama.cpp"
      url: https://zenn.dev/topics/llamacpp/feed
    - name: "Zenn #LM Studio"
      url: https://zenn.dev/topics/lmstudio/feed
    - name: "Qiita #ComfyUI"
      url: https://qiita.com/tags/comfyui/feed
    - name: "Qiita #StableDiffusion"
      url: https://qiita.com/tags/stablediffusion/feed
    - name: "Qiita #ローカルLLM"
      url: https://qiita.com/tags/%E3%83%AD%E3%83%BC%E3%82%AB%E3%83%ABllm/feed
    - name: "Qiita #Ollama"
      url: https://qiita.com/tags/ollama/feed
    - name: "Qiita #llama.cpp"
      url: https://qiita.com/tags/llama.cpp/feed

# ==== 海外のAI話題（英語の情報源 → LLMが日本語で要約） ====
# 上の ai_digest（日本語記事・#ai-llm）とは別のチャンネルに投稿します。既読管理も別です。
# llm: を書かなければ、上の ai_digest の llm と同じサーバー・モデルを使います。
ai_global:
  # Discordに表示する名前
  title: 海外AIダイジェスト
  # Discord に表示するアイコン（assets/ai_global.png。作り直すときは scripts/make_icons.py）
  avatar_url: https://raw.githubusercontent.com/code89314-bit/info-digest/main/assets/ai_global.png?v=1
  # 投稿先の Webhook URL を入れる環境変数の名前（値は .env に書く）
  webhook_env: DISCORD_WEBHOOK_AI_GLOBAL
  # 1回のダイジェストの最大件数
  max_items: 10
  # LLMに見せる候補の最大数（多いほど時間がかかる。25件で約1分）
  max_candidates: 150
  # 1つの情報源（sources の name ごと）から採用する最大件数。偏りを抑える（0 または書かなければ上限なし）
  max_per_source: 4
  # 何時間前までの記事を対象にするか
  lookback_hours: 36

  # ---- 何を拾うか（LLMへの指示。自由に書き換えてOK） ----
  focus: |
    英語圏で話題になっている、VRAM 16GB以下のGPU（RTX 4060 Ti 16GB / 4070系など）で動かせるローカル実行のAI。
    - ローカルLLM：新モデル（〜30B程度の量子化まで）、llama.cpp / Ollama / LM Studio の新機能、GGUF量子化
    - ComfyUI・画像/動画生成：本体の更新、16GBで動く新モデル・量子化版、新しいワークフローや省VRAM化の手法
    コミュニティで評判の良い（実際に試した人の報告が多い）ものを特に優先。
  exclude: |
    クラウド専用・API専用のサービスやモデル、24GB以上のVRAMが前提のもの（量子化して16GBに収まるなら採用）、
    企業の資金調達・経営ニュース、AI規制や政策の話題、質問だけの投稿・ミーム・雑談、自作品の見せびらかしだけの投稿
  interests:
    - 16GB VRAMで動く新モデル
    - ComfyUIの新機能・新ワークフロー
    - 日本語に強いローカルLLM
  # 見出しの分類
  tags: [ComfyUI・画像/動画生成, ローカルLLM, ツール・アップデート, その他]

  # LLMが使えないときの絞り込みキーワード（大文字小文字は区別しない）
  fallback_keywords: [comfyui, gguf, llama.cpp, ollama, lm studio, local, quantiz, vram, flux, wan]

  # 英語の情報源
  sources:
    # Reddit：その日の上位投稿（コミュニティで話題のもの）
    - name: "Reddit r/LocalLLaMA"
      url: https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day&limit=25
    - name: "Reddit r/comfyui"
      url: https://www.reddit.com/r/comfyui/top/.rss?t=day&limit=25
    - name: "Reddit r/StableDiffusion"
      url: https://www.reddit.com/r/StableDiffusion/top/.rss?t=day&limit=25
    # Hacker News：LLMの話題で100点以上
    - name: Hacker News
      url: https://hnrss.org/newest?q=LLM&points=100
    # Hugging Face：トレンド入りしたモデル（初登場のものだけ）。種類で絞る
    - name: HF トレンド
      type: hf_models
      pipeline_tags: [text-generation, image-text-to-text, any-to-any, text-to-image, image-to-image, text-to-video, image-to-video]
    # 本体のリリース
    - name: ComfyUI リリース
      url: https://github.com/Comfy-Org/ComfyUI/releases.atom
    - name: Ollama リリース
      url: https://github.com/ollama/ollama/releases.atom

# ==== 朝のニュース（広告なしの自分専用ニュース）====
# NHK などの RSS から、関心に合うものだけを Strata が選んで要約し、#ニュース に投稿します。
# 要約は Discord の中で読めるので、リンク先（広告の多いページ）を開かなくて済みます。
# 実行: python src/ai_digest.py news （タスク「info-digest news」毎朝 6:50）
# llm: を書かなければ ai_digest の llm と同じサーバー・モデルを使います。
news:
  icon: 📰
  # Discordに表示する名前
  title: 朝のニュース
  # 投稿先の Webhook URL を入れる環境変数の名前（値は .env に書く）
  webhook_env: DISCORD_WEBHOOK_NEWS
  # 欄（まとめ・株式・沿線・分類）ごとに別の投稿にする
  split_posts: true
  # 欄に付ける画像: header（欄の見出し・日付・画像を本文の上に。本文の幅は狭くならない）／
  # thumbnail（右上に小さく。本文の幅が狭くなる）／image（本文の下に大きく）／off。
  # 欄の最初の記事のページの写真。取れなければ欄の絵文字の絵
  images: header
  # この日数より前の朝のニュースの投稿を、毎朝の投稿のあとで Discord から消す（消すと戻せない。0 か削除で消さない）。
  # 消せるのはこの仕組みを入れた 2026-10-31 以降の投稿だけ
  keep_days: 7
  # 1回の最大件数
  max_items: 15
  # LLMに見せる候補の最大数（多いほど時間がかかる。25件で約1分）。上の sources の順に数えます
  max_candidates: 200
  # 何時間前までの記事を対象にするか（前日朝〜今朝）
  lookback_hours: 24
  # 要約の長さ（字）。リンク先を開かなくても分かるよう少し長め
  summary_len: 150
  # 要約の書き方（書かなければ「何が新しく、なぜ重要かを1〜2文」）。
  # ニュースは事実だけにする：「〜が求められる」「〜に影響する」のような解釈・評価を付けさせない
  summary_rule: |
    いつ・誰が・何をしたか（数字・日付・固有名詞を含む）を事実だけで1〜2文。文末は「〜しました」「〜です」のです・ます調。
    記事に書かれていない影響・評価・教訓・助言（「〜が求められる」「〜に影響する」「〜として重要」「注目される」など）は書かない。
    値上がり・値下がり、円高・円安、増・減などの向きは、記事の言葉をそのまま使う（言い換えると向きを取り違えやすい）
  # 見出しの書き方（書かなければ「内容が分かる簡潔な見出し」）
  title_rule: |
    助詞（が・を・に・で・へ）を省かない、そのまま読める短い文の見出し。
    例: ×「立民消費税減税法案対案非課税世帯に5万円給付」 ○「立民が消費税減税の対案、非課税世帯に5万円給付」。
    値上がり・値下がり、円高・円安などの向きは記事の言葉どおりにし、要約と食い違わせない
    （例: 記事が「円相場が値上がり」なら「円が値上がり」。「下落」と書き換えない）

  # ---- 何を拾うか（LLMへの指示。ここを書き換えると「自分専用」に近づきます） ----
  focus: |
    朝の数分で「今日知っておくべきこと」をつかむためのニュース。
    - 暮らし・仕事に影響する制度や政策（物価・税・社会保障・医療制度・診療報酬・薬価など）
    - 経済の大きな動き（金利・為替・株価の大きな変動、大企業の重要な発表）
    - 国内政治・国際情勢の大きな出来事（日本への影響があるもの）
    - 医療・科学・テクノロジーの新しい知見や発表
    - 大規模な災害・事故（多くの人に影響するもの）
  exclude: |
    芸能・ゴシップ、スポーツの試合結果、囲碁・将棋、個別の小さな事件事故（被害が限られるもの）、
    地域限定の話題、季節の風物詩、行事やイベントの紹介、
    地震情報・医薬品の供給情報（別のチャンネルで受け取っているので不要）
  adopt: 上の関心に合う、事実が具体的に書かれたニュース
  interests:
    - 医療・薬に関する制度や政策
    - 生活費（物価・税・補助）に関わること
  # 見出しの分類
  tags: [政治・制度, 経済・暮らし, 国際, 医療・科学・IT, 社会, その他]
  # 分類の目安（LLMへの説明）
  tag_guide: 海外で起きた出来事は内容にかかわらず「国際」。日本の物価・企業・金融は「経済・暮らし」。日本の事件・事故・災害は「社会」
  tag_style:
    政治・制度: {emoji: '🏛️', color: '#5C6BC0'}
    経済・暮らし: {emoji: '💴', color: '#43A047'}
    国際: {emoji: '🌏', color: '#26A69A'}
    医療・科学・IT: {emoji: '🔬', color: '#AB47BC'}
    社会: {emoji: '🏙️', color: '#FFA726'}
  # 先頭に「今日の動向まとめ」（3行程度の全体要約）を付ける（問い合わせが1回増える）
  overview:
    enabled: true
    audience: 忙しい社会人（医療職）。朝の数分でニュースをつかみたい
    group_by: 分類
    # まとめの組み立て方（書かなければ「分類ごとに見出し＋影響・注意点」。ニュースは事実の箇条書きだけにする）
    layout: 今日いちばん大事な出来事を3〜5個、箇条書きで（見出しは付けない）
    max_chars: 400
    rules:
      - 3〜5個の箇条書きだけで、見出しは付けない。各行は1文・60字以内、です・ます調
      - 記事に書かれた事実だけを書く。影響・教訓・助言（「〜が求められる」「〜に注意が必要」「医療現場にも〜」など）は書かない
  # LLMが使えないときの絞り込みキーワード
  fallback_keywords: [政府, 閣議, 法案, 物価, 金利, 日銀, 為替, 株価, 医療, 薬, 診療報酬, 年金, 税, 補助, 選挙, 首相, 大統領]

  # ---- 株式の欄（src/market.py）。「今日の動向まとめ」の次に1つ付きます（問い合わせが1回増える） ----
  # 株価（終値・前日比）は Yahoo Finance から取った正確な数字。原因・発表は下の sources の見出しを LLM が読んでまとめます
  # 朝の時点で、米国株は前日（米国時間）、日本株は前営業日の終値。欄の見出しに市場ごとの日付が出ます
  market:
    enabled: true
    audience: S&P500・米国のビッグテック株と、日本の個別株に投資している個人
    # 値動きの原因を書く銘柄の最大数／業績に影響しそうな発表の最大数
    max_movers: 5
    max_releases: 4
    lookback_hours: 24
    # LLMに見せる見出しの最大数（多いと遅くなる）
    max_headlines: 80
    # 株価を取る銘柄。先頭は指数（S&P500）にする。symbol は Yahoo Finance の記号（finance.yahoo.com で検索すると分かる）
    # 日本株は「証券コード.T」（例: トヨタは 7203.T）。銘柄を変えたら、下の sources の検索語も合わせる
    quotes:
      - {symbol: "^GSPC", name: S&P500}
      - {symbol: NVDA, name: エヌビディア}
      # aliases: 記事での別の呼び方（「業績に影響しそうな発表」は、名前か別名を含むものだけ載せる）
      - {symbol: GOOGL, name: アルファベット, aliases: [グーグル, Google]}
      - {symbol: META, name: メタ}
      - {symbol: 4661.T, name: オリエンタルランド}
      - {symbol: 4755.T, name: 楽天グループ}
      - {symbol: 7867.T, name: タカラトミー}
      - {symbol: 9202.T, name: ANAホールディングス, aliases: [全日空]}
    # 見出しにこの言葉を含むものは使わない（株価ページ・投資信託のページなど、ニュースでないもの）
    skip_titles: ["株価・株式情報", "基準価格", "Stocks to Buy", "買うべき"]
    # 見出しを集める先（Googleニュースの検索RSS。when:1d = 直近1日。検索語は q= の後ろ）
    sources:
      - name: "Googleニュース: 米国株の市況"
        url: https://news.google.com/rss/search?q=%E7%B1%B3%E5%9B%BD%E6%A0%AA%20OR%20NY%E3%83%80%E3%82%A6%20OR%20S%26P500%20OR%20%E3%83%8A%E3%82%B9%E3%83%80%E3%83%83%E3%82%AF%20%E5%B8%82%E6%B3%81%20OR%20%E7%B5%82%E5%80%A4%20OR%20%E6%A6%82%E6%B3%81%20when%3A1d&hl=ja&gl=JP&ceid=JP:ja
