# ==== 設定ファイル（ここを編集すれば挙動を変えられます） ====

earthquake:
  # 投稿する最小震度  10=1, 20=2, 30=3, 40=4, 45=5弱, 50=5強, 55=6弱, 60=6強, 70=7
  min_scale: 30
  # 津波予報（警報・注意報）を投稿するか
  tsunami: true

drug_supply:
  # 各区分で一覧表示する最大件数（超えた分は「ほか○件」）
  max_items_per_section: 25
  # 気になる成分名・品名（部分一致）。該当すると⭐で別枠表示されます
  watchlist:
    # - アモキシシリン
    # - カルボシステイン
    # - トラネキサム酸

ai_digest:
  # Discordに表示する名前
  title: ローカルAIダイジェスト
  # Claude API のモデル（下の llm.provider を anthropic にしたときだけ使用。ANTHROPIC_API_KEY が必要）
  model: claude-haiku-5-5

  # ---- 記事の選別・要約に使うLLM ----
  # LLMが使えないとき（サーバー停止中・エラー）は、fallback_keywords に一致した記事の見出しだけを投稿します
  llm:
    # openai_compat = 自宅のローカルLLMサーバー / anthropic = Claude API / none = LLMを使わない
    provider: openai_compat
    # ローカルLLMサーバーのアドレス（末尾は /v1）。いまは同じPCの Strata。
    # 例: Ollama http://localhost:11434/v1 、LM Studio http://localhost:1234/v1
    base_url: http://127.0.0.1:8080/v1
    # サーバーで動いているモデル名（Strata は strata launch の表示、Ollama は ollama list で確認）
    model: qwen3.8-flash-next-q2_0
    # APIキーを入れる環境変数の名前（キーの値そのものは .env に書く。不要なら空でよい）
    api_key_env: LOCAL_LLM_API_KEY
    # 1回の問い合わせを待つ最大秒数
    timeout: 600
    # 0に近いほど毎回同じような選び方になる
    temperature: 0.2
    # 1回の問い合わせに入れる候補の数。多いとVRAM・文脈長を圧迫するので25件ずつ分けて選ぶ
    batch_size: 25
    # 候補1件あたり、本文の冒頭を何文字までLLMに見せるか
    summary_chars: 200
    # 返答の最大トークン数（考える時間も含む）
    max_tokens: 4000
    # JSON形式での返答をサーバーに要求する（非対応のサーバーなら自動で外して再送）
    json_mode: true
    # 出典は違うが同じ出来事を報じた記事を、最後にLLMで1件にまとめる（問い合わせが1回増える）
    dedupe: true
    # サーバー独自の追加設定（そのままリクエストに付ける）。
    # Strata: reasoning_budget_tokens = 考える量の上限（0で無制限）。
    #         考えさせない場合は reasoning_budget_tokens の代わりに  chat_template_kwargs: {enable_thinking: false}
    extra_body:
      reasoning_budget_tokens: 1024
  # 1回のダイジェストの最大件数
  max_items: 12
  # 何時間前までの記事を対象にするか
  lookback_hours: 36

  # ---- 何を拾うか（LLMへの指示。自由に書き換えてOK） ----
  focus: |
    VRAM 16GB以下のGPU（RTX 4060 Ti 16GB / 4070系など）で動かせる、ローカル実行のAI。
    - ComfyUI：本体のアップデート、新しいモデル対応、カスタムノード、ワークフロー、省VRAM化の手法
    - 画像・動画生成モデル（Flux、SDXL、Wan、HunyuanVideo 等）のうち16GBで動くもの・量子化版（GGUF/FP8/NF4）
    - ローカルLLM：llama.cpp / Ollama / LM Studio、GGUF量子化、16GBに収まるサイズ（〜30B程度の量子化まで）の新モデル
    実際に手元で試した検証記事（速度・VRAM使用量・設定値などの具体的な数字があるもの）を特に優先。
  exclude: |
    クラウド専用・API専用のサービスやモデル、24GB以上のVRAMが前提のもの（量子化して16GBに収まるなら採用）、
    企業の資金調達・経営ニュース、AI規制や政策の話題、一般向けのAI活用ハウツー
  interests:
    - 16GB VRAMで動く新モデル
    - ComfyUIの新機能・新ワークフロー
    - 日本語に強いローカルLLM
  # 見出しの分類
  tags: [ComfyUI・画像/動画生成, ローカルLLM, ツール・アップデート, その他]

  # LLMが使えないときの絞り込みキーワード（大文字小文字は区別しない）
  fallback_keywords: [comfyui, gguf, llama.cpp, ollama, lm studio, local, quantiz, vram, flux, wan, ローカル]

  # 日本語の記事だけを対象にする（Zenn・Qiitaのタグ別新着）
  sources:
    - name: "Zenn #ComfyUI"
      url: https://zenn.dev/topics/comfyui/feed
    - name: "Zenn #StableDiffusion"
      url: https://zenn.dev/topics/stablediffusion/feed
    - name: "Zenn #ローカルLLM"
      url: https://zenn.dev/topics/localllm/feed
    - name: "Zenn #Ollama"
      url: https://zenn.dev/topics/ollama/feed
    - name: "Zenn #llama.cpp"
      url: https://zenn.dev/topics/llamacpp/feed
    - name: "Zenn #LM Studio"
      url: https://zenn.dev/topics/lmstudio/feed
    - name: "Qiita #ComfyUI"
      url: https://qiita.com/tags/comfyui/feed
    - name: "Qiita #StableDiffusion"
      url: https://qiita.com/tags/stablediffusion/feed
    - name: "Qiita #ローカルLLM"
      url: https://qiita.com/tags/%E3%83%AD%E3%83%BC%E3%82%AB%E3%83%ABllm/feed
    - name: "Qiita #Ollama"
      url: https://qiita.com/tags/ollama/feed
    - name: "Qiita #llama.cpp"
      url: https://qiita.com/tags/llama.cpp/feed

# ==== 海外のAI話題（英語の情報源 → LLMが日本語で要約） ====
# 上の ai_digest（日本語記事・#ai-llm）とは別のチャンネルに投稿します。既読管理も別です。
# llm: を書かなければ、上の ai_digest の llm と同じサーバー・モデルを使います。
ai_global:
  # Discordに表示する名前
  title: 海外AIダイジェスト
  # 投稿先の Webhook URL を入れる環境変数の名前（値は .env に書く）
  webhook_env: DISCORD_WEBHOOK_AI_GLOBAL
  # 1回のダイジェストの最大件数
  max_items: 10
  # LLMに見せる候補の最大数（多いほど時間がかかる。25件で約1分）
  max_candidates: 150
  # 何時間前までの記事を対象にするか
  lookback_hours: 36

  # ---- 何を拾うか（LLMへの指示。自由に書き換えてOK） ----
  focus: |
    英語圏で話題になっている、VRAM 16GB以下のGPU（RTX 4060 Ti 16GB / 4070系など）で動かせるローカル実行のAI。
    - ローカルLLM：新モデル（〜30B程度の量子化まで）、llama.cpp / Ollama / LM Studio の新機能、GGUF量子化
    - ComfyUI・画像/動画生成：本体の更新、16GBで動く新モデル・量子化版、新しいワークフローや省VRAM化の手法
    コミュニティで評判の良い（実際に試した人の報告が多い）ものを特に優先。
  exclude: |
    クラウド専用・API専用のサービスやモデル、24GB以上のVRAMが前提のもの（量子化して16GBに収まるなら採用）、
    企業の資金調達・経営ニュース、AI規制や政策の話題、質問だけの投稿・ミーム・雑談、自作品の見せびらかしだけの投稿
  interests:
    - 16GB VRAMで動く新モデル
    - ComfyUIの新機能・新ワークフロー
    - 日本語に強いローカルLLM
  # 見出しの分類
  tags: [ComfyUI・画像/動画生成, ローカルLLM, ツール・アップデート, その他]

  # LLMが使えないときの絞り込みキーワード（大文字小文字は区別しない）
  fallback_keywords: [comfyui, gguf, llama.cpp, ollama, lm studio, local, quantiz, vram, flux, wan]

  # 英語の情報源
  sources:
    # Reddit：その日の上位投稿（コミュニティで話題のもの）
    - name: "Reddit r/LocalLLaMA"
      url: https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day&limit=25
    - name: "Reddit r/comfyui"
      url: https://www.reddit.com/r/comfyui/top/.rss?t=day&limit=25
    - name: "Reddit r/StableDiffusion"
      url: https://www.reddit.com/r/StableDiffusion/top/.rss?t=day&limit=25
    # Hacker News：LLMの話題で100点以上
    - name: Hacker News
      url: https://hnrss.org/newest?q=LLM&points=100
    # Hugging Face：トレンド入りしたモデル（初登場のものだけ）。種類で絞る
    - name: HF トレンド
      type: hf_models
      pipeline_tags: [text-generation, image-text-to-text, any-to-any, text-to-image, image-to-image, text-to-video, image-to-video]
    # 本体のリリース
    - name: ComfyUI リリース
      url: https://github.com/Comfy-Org/ComfyUI/releases.atom
    - name: Ollama リリース
      url: https://github.com/ollama/ollama/releases.atom

# ==== がん薬物療法ニュース（国内中心・週単位・曜日テーマ）====
# src/onco_news.py が動かします（タスク「info-digest onco」毎日 7:50）。
#   毎日: 新着を Strata が選別・分類して「週間アーカイブ」にためる（投稿しない。急ぎの安全性情報だけ即日投稿）
#   曜日: 直近1週間のアーカイブから、その曜日のテーマの記事を NotebookLM に読ませて、まとめ＋podcast を投稿
# llm: を書かなければ ai_digest の llm と同じサーバー・モデルを使います。
onco:
  title: がん薬物療法ニュース
  icon: 💊
  # Discord に表示するアイコン（assets/onco.png。作り直すときは scripts/make_icons.py）
  avatar_url: https://raw.githubusercontent.com/code89314-bit/info-digest/main/assets/onco.png?v=2
  # 投稿先の Webhook URL を入れる環境変数の名前（値は .env に書く）
  webhook_env: DISCORD_WEBHOOK_ONCO
  # 投稿の冒頭に小さく表示する注意書き
  notice: LLMによる自動要約です。誤りを含む可能性があります。治療・調剤の判断は添付文書・ガイドライン原文で確認してください。
  # 1日にアーカイブへ入れる最大件数
  max_items: 15
  max_candidates: 200
  lookback_hours: 48
  # アーカイブを何日分残すか
  archive_days: 21
  # 1件あたりの要約の最大文字数
  summary_len: 150

  # ---- 曜日ごとのテーマ（tags はアーカイブの分類。空なら全部 = 週間まとめ）。書いていない曜日は休み ----
  schedule:
    mon: {theme: 新薬, emoji: '💊', color: '#43A047', tags: [新薬・承認], instructions: 承認・適応追加・申請・部会審議を、国内で使えるようになる時期と位置づけを中心に。}
    tue: {theme: 治療ストラテジー, emoji: '🧭', color: '#1E88E5', tags: [治療ストラテジー], instructions: 標準治療や治療の順番がどう変わりうるか、根拠となる試験の結果と限界を中心に。}
    wed: {theme: ガイドライン, emoji: '📘', color: '#3949AB', tags: [ガイドライン], instructions: どの学会のどの版で何が変わったか、推奨度と現場で変えるべきことを中心に。}
    thu: {theme: 治験, emoji: '🧪', color: '#00897B', tags: [治験], instructions: 国内で進行中・開始・結果が出た治験を、対象患者と参加の目安が分かるように。}
    fri: {theme: 安全性・行政, emoji: '🛡️', color: '#F4511E', tags: [安全性情報, 行政・供給], instructions: 添付文書改訂・副作用・供給、薬事審議会・薬価収載などの行政の動きを、現場で必要な対応を中心に。}
    sat: {theme: 週間まとめ, emoji: '🗓️', color: '#8E24AA', tags: [], max_items: 20, format: deep-dive, instructions: 1週間の主な動きを、新薬・治療・ガイドライン・治験・安全性の順にふり返り、最後に今週のポイントを3つにまとめる。}
  episode:
    # 直近何日分のアーカイブを使うか
    lookback_days: 7
    # テーマの記事がこの件数より少ない週は作らない（週間まとめに任せる）
    min_items: 2
    # 1回で NotebookLM に読ませる最大件数
    max_items: 15
  # 急ぎの安全性情報は、アーカイブに入れた日にすぐテキストで投稿する（score は LLM がつける 1〜5）
  urgent:
    enabled: true
    tags: [安全性情報]
    min_score: 4
    color: '#D50000'

  # ---- 何を拾うか（LLMへの指示。自由に書き換えてOK） ----
  focus: |
    病院薬剤師・がん専門薬剤師が日常業務で知っておくべき、がん薬物療法（抗がん剤）の新しい情報。国内の情報を最優先。
    - 新薬：抗がん剤の承認・適応追加・承認申請・薬事審議会（部会）での審議（国内が中心。海外は FDA・EMA の重要な承認のみ）
    - 治療ストラテジー：標準治療や治療の順番を変えうる大規模臨床試験の結果（第3相など）、主要学会での発表
    - ガイドライン：各種がんの診療ガイドラインの公開・改訂（国内学会が中心。NCCN・ESMO・ASCO も可）
    - 治験：国内で開始・進行中・結果が出た抗がん剤の治験、先進医療・患者申出療養
    - 安全性・行政：抗がん剤の添付文書改訂、重大な副作用、適正使用のお願い、供給・回収、薬価収載、最適使用推進ガイドライン
  adopt: 上の関心に直接関わる一次情報（承認・ガイドライン改訂・安全性情報・治験・重要な臨床試験結果）。同程度なら国内の情報を優先
  exclude: |
    抗がん剤・がん治療と関係のない話題（他の疾患の薬、医療制度一般、人事・採用、イベント告知だけのもの）、
    がん検診・予防・生活習慣の話題、基礎研究だけで臨床への道筋がまだ遠いもの、企業の業績・株価・提携ニュース
  interests:
    - 日本で使えるようになる新薬・新しい適応
    - 国内ガイドラインの改訂
    - 免疫チェックポイント阻害薬・抗体薬物複合体（ADC）・分子標的薬
  # 見出しの分類（= 曜日テーマの振り分け先）
  tags: [新薬・承認, 治療ストラテジー, ガイドライン, 治験, 安全性情報, 行政・供給, その他]
  # 分類ごとの見出しの絵文字と色（曜日テーマの色とそろえる）
  tag_style:
    新薬・承認: {emoji: '💊', color: '#43A047'}
    治療ストラテジー: {emoji: '🧭', color: '#1E88E5'}
    ガイドライン: {emoji: '📘', color: '#3949AB'}
    治験: {emoji: '🧪', color: '#00897B'}
    安全性情報: {emoji: '⚠️', color: '#E53935'}
    行政・供給: {emoji: '🏛️', color: '#F4511E'}
    その他: {emoji: '📎', color: '#90A4AE'}
  # LLMが使えないときの絞り込みキーワード
  fallback_keywords: [がん, 癌, 腫瘍, 抗悪性, 白血病, リンパ腫, 骨髄腫, 肉腫, cancer, oncolog, tumor, carcinoma, lymphoma, leukemia, myeloma]

  # ---- 今日の動向まとめ（選んだ記事をLLMが総括して、投稿の先頭に付ける） ----
  overview:
    enabled: true
    audience: 病院薬剤師・がん専門薬剤師
    group_by: がん種（がん種に分けられないものは「新薬・承認全般」「安全性情報」など）
    max_chars: 1200
    rules:
      - 海外（FDA・EMA等）の承認は「海外（FDA）」のように明記する。日本での承認・保険適用は情報に書かれている場合だけ書き、書かれていないときは触れない（「記載なし」とも書かない）
      - ガイドラインは学会名・版・主な変更点を書く

  # ---- podcast（NotebookLM の音声概要）。このPCでだけ動く ----
  podcast:
    enabled: true
    # 選ばれた記事がこの件数より少ない日は作らない
    min_items: 2
    # true: 記事の選別だけ Strata、見出し・要約・動向まとめは記事本文を読んだ NotebookLM が書く（日本語が自然で、
    #       資料に基づいて書く）。NotebookLM が使えないときは Strata の要約で投稿。false: 全部 Strata
    summarize: true
    # NotebookLM のノート名
    title: がん薬物療法ニュース
    # 番組への指示（NotebookLM に渡す。曜日ごとのテーマと、schedule の instructions が後ろに付く）
    instructions: |
      日本の病院薬剤師・がん専門薬剤師向けの、週刊がん薬物療法ニュース番組。国内の情報を中心に扱う。
      資料（直近1週間の記事）から今回のテーマに関わるトピックを拾い、がん種ごとに整理して、
      何が変わったか・臨床現場（処方監査、副作用モニタリング、患者指導）への影響を具体的に解説する。
      海外の承認と日本の承認を必ず区別し、資料にない数値や承認状況は推測しない。
      最後に「今回のポイント」を3つにまとめる。
    format: deep-dive      # deep-dive / brief / critique / debate
    length: default        # short / default / long（長いと Discord の10MBに収まらないことがある）
    language: ja
    # 記事のURLを資料として読ませる件数（本文まで読んだ要約・解説になる。取れないURLは飛ばす）
    max_url_sources: 12
    # Discord の添付上限（ブースト無しのサーバーは10MB）
    max_mb: 9.5
    file_prefix: onco
    # notebooklm CLI の場所（Python 3.10 に入っている）と、認証の自動延命コマンド
    cli: notebooklm
    cli_path_add: '%APPDATA%\Python\Python310\Scripts'
    auth_refresh: ['C:\Program Files\Python310\python.exe', 'E:\onco_tekisei\nlm_auth.py', refresh]
    # 音声の1日上限（適正使用ガイド用の onco_tekisei と同じ台帳で合算）
    ledger: 'E:\onco_tekisei\audio_usage.json'
    daily_limit: 3

  sources:
    # ---- 国内 ----
    - name: PMDA 承認審査
      url: https://www.pmda.go.jp/rss_021.xml
    - name: PMDA 安全対策
      url: https://www.pmda.go.jp/rss_018.xml
    - name: 厚労省 報道発表
      url: https://www.mhlw.go.jp/stf/news.rdf
    - name: Minds 診療ガイドライン
      url: https://minds.jcqhc.or.jp/feed/
    - name: 薬事日報
      url: https://www.yakuji.co.jp/feed
    - name: AnswersNews
      url: https://answers.ten-navi.com/pharmanews/feed/
    - name: QLifePro 医療ニュース
      url: https://www.qlifepro.com/feed/
    # ---- 海外（英語。LLMが日本語で要約） ----
    - name: ESMO News
      url: https://www.esmo.org/rss/feed/esmo-news
    - name: NCI Cancer Currents
      url: https://www.cancer.gov/publishedcontent/rss/news-events/cancer-currents-blog.rss
    - name: NCI News Releases
      url: https://www.cancer.gov/publishedcontent/rss/syndication/rss/ncinewsreleases.rss
    - name: OncLive
      url: https://www.onclive.com/rss
    - name: Targeted Oncology
      url: https://www.targetedonc.com/rss
    - name: CancerNetwork
      url: https://www.cancernetwork.com/rss

# ==== がん薬物療法 学習番組（毎日1テーマを掘り下げる podcast）====
# src/learn.py が動かします（タスク「info-digest learn」毎日 6:30）。
#   Strata: 下の categories（カテゴリと種リスト）から具体的な学習テーマを作って蓄える（テーマ帳）
#   毎日: 未消化のテーマを1つランダムに選び、NotebookLM のウェブ調査で一次資料を集めて、要点の投稿と podcast
# 種リスト（seeds）は自由に足し引きできます。扱ったテーマは繰り返しません。
learn:
  title: がん薬物療法 学習
  icon: 📚
  avatar_url: https://raw.githubusercontent.com/code89314-bit/info-digest/main/assets/learn.png?v=2
  webhook_env: DISCORD_WEBHOOK_ONCO
  notice: NotebookLM がウェブ上の資料から自動で作成しています。誤りを含む可能性があります。判断は添付文書・ガイドライン原文で確認してください。
  audience: 病院薬剤師・がん専門薬剤師
  # 要点の最大文字数
  max_chars: 1500
  # テーマ帳の未消化がこの数を下回ったら Strata が補充する
  min_pending: 10
  topics_per_seed: 3
  max_refill_calls: 4
  # NotebookLM のウェブ調査: fast（数分）/ deep（時間をかけて深く。10分以上かかることがある）
  research_mode: fast
  # 資料がこの数より少なければ、そのテーマは捨てる
  min_sources: 2

  categories:
    - name: 適正使用ガイド
      weight: 2
      hint: 適正使用ガイド・RMP・添付文書にある、投与前の確認事項、重大な副作用の早期発見と対処、休薬・減量・再開の基準を中心に
      seeds: [オプジーボ, キイトルーダ, テセントリク, イミフィンジ, ヤーボイ, エンハーツ, パドセブ, トロデルビ, ダトロウェイ,
              カドサイラ, パージェタ, フェスゴ, タグリッソ, アレセンサ, ローブレナ, ルマケラス, ライブリバント, リムパーザ, ゼジューラ,
              イブランス, ベージニオ, レンビマ, カボメティクス, スチバーガ, ロンサーフ, サイラムザ, アバスチン, ベクティビックス,
              ダラザレックス, サークリサ, カイプロリス, レブラミド, ベネクレクスタ, イムブルビカ, カルケンス, ポライビー, ブリンサイト,
              ゾスパタ, テプミトコ, タブレクタ]
    - name: 治療ガイドライン
      weight: 2
      hint: 日本の学会の最新版ガイドラインで、推奨（クリニカルクエスチョン）とその根拠、改訂で変わった点を中心に
      seeds: [肺癌診療ガイドライン（日本肺癌学会）, 乳癌診療ガイドライン（日本乳癌学会）, 大腸癌治療ガイドライン（大腸癌研究会）,
              胃癌治療ガイドライン（日本胃癌学会）, 膵癌診療ガイドライン（日本膵臓学会）, 肝癌診療ガイドライン（日本肝臓学会）,
              食道癌診療ガイドライン（日本食道学会）, 造血器腫瘍診療ガイドライン（日本血液学会）, 卵巣がん・卵管癌・腹膜癌治療ガイドライン,
              前立腺癌診療ガイドライン, 腎癌診療ガイドライン, 膀胱癌診療ガイドライン, 頭頸部癌診療ガイドライン,
              制吐薬適正使用ガイドライン（日本癌治療学会）, 発熱性好中球減少症（FN）診療ガイドライン,
              がん薬物療法に伴う末梢神経障害の診療ガイドライン, がん患者の口腔ケア・粘膜炎, 免疫関連有害事象（irAE）の管理]
    - name: 治療の変遷
      weight: 1
      hint: 標準治療がどう変わってきたか、各段階で根拠となった試験と、何が変わった理由かを中心に
      seeds: [HER2陽性乳癌, ホルモン受容体陽性HER2陰性乳癌, EGFR遺伝子変異陽性非小細胞肺癌, ALK融合遺伝子陽性肺癌,
              PD-L1と非小細胞肺癌の免疫療法, 切除不能大腸癌の一次治療, 胃癌の一次治療（免疫療法・クローディン18.2）,
              肝細胞癌の薬物療法, 多発性骨髄腫, 慢性リンパ性白血病, びまん性大細胞型B細胞リンパ腫, 尿路上皮癌（ADCと免疫療法）,
              卵巣癌のPARP阻害薬, 去勢抵抗性前立腺癌, 周術期の免疫療法（術前・術後）]

  # ---- podcast（NotebookLM の音声概要）----
  podcast:
    enabled: true
    instructions: |
      日本の病院薬剤師・がん専門薬剤師向けの学習番組。1つのテーマを深く掘り下げる。
      資料（適正使用ガイド・ガイドライン・論文など）に基づき、背景 → 根拠となるデータ → 現場での判断・対応、の順に解説する。
      資料にない数値・推奨は推測しない。最後に「現場でのポイント」を3つにまとめる。
    format: deep-dive
    length: default
    language: ja
    max_mb: 9.5
    file_prefix: learn
    cli: notebooklm
    cli_path_add: '%APPDATA%\Python\Python310\Scripts'
    auth_refresh: ['C:\Program Files\Python310\python.exe', 'E:\onco_tekisei\nlm_auth.py', refresh]
    ledger: 'E:\onco_tekisei\audio_usage.json'
    daily_limit: 3

# ==== note 週刊マガジン「週刊がん薬物療法ニュース」の下書き ====
# src/note_weekly.py が動かします（土曜の週間まとめの後に実行する想定）。
#   直近7日の週間アーカイブ（onco が毎日ためている記事、全分類）を NotebookLM に読ませ、
#   style_file の文体・型で1本の下書きにして、.local/note_drafts/ に .md と .html で保存し、Discord に通知します。
#   note への公開は手で行います（自動投稿はしません）。
# 試すとき: python src/note_weekly.py --dry-run （Discord に送らず、ファイルだけ作る）
note_weekly:
  enabled: true
  title: note 下書き
  # 文体・構成の設定ファイル（書き方の直しはこちらに書く）
  style_file: style/jibun_yakkyoku.yaml
  # 通知先の Webhook URL を入れる環境変数の名前（値は .env に書く）
  webhook_env: DISCORD_WEBHOOK_NOTE
  avatar_url: https://raw.githubusercontent.com/code89314-bit/info-digest/main/assets/onco.png?v=2
  # 何日分の記事を使うか（作る日を含む）
  lookback_days: 7
  # NotebookLM に読ませる最大記事数（スコアの高い順）
  max_items: 30
  # 記事がこの数より少ない週は作らない
  min_items: 3
  # 1回の質問で書かせるテーマ数（多いと回答が途中で切れる。NotebookLM のチャット回数は「テーマ数÷これ＋1」回）
  themes_per_ask: 2
  max_topics_per_theme: 4
  # 40字を超える文に、Strata で「分けた案」を確認メモに付ける
  split_long_sentences: true
  # 記事の分類 → 号のテーマ（style_file の issue.sections の order と同じ名前にする）。書かなければ下と同じ
  # theme_map:
  #   新薬・承認: 新薬・承認
  #   治療ストラテジー: 治療ストラテジー（臨床試験）
  #   ガイドライン: ガイドライン
  #   治験: 治験
  #   安全性情報: 安全性・行政
  #   行政・供給: 安全性・行政
  # NotebookLM の設定（CLI の場所・認証・音声の台帳は onco.podcast と共通。ここに書いた項目だけ上書き）
  notebook:
    max_url_sources: 30
  # note への自動の「下書き保存」（非公開。公開は手で行う）。src/note_publish.py が note 専用のブラウザを操作する
  # 最初に1回だけ: .venv\Scripts\python.exe src\note_publish.py --login で開いたブラウザから note にログイン
  note_post:
    enabled: true
    # false: ブラウザの画面を出して操作する（土曜の実行時に数十秒だけ画面が出る）。
    # true（画面なし）は note のエディタの読み込みが終わらず失敗する（2026-10-21 確認）
    headless: false
