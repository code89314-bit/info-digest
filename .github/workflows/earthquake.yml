name: 地震・津波情報

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC表記（5分ごと。GitHub側の混雑で数分遅れることがあります）
  workflow_dispatch:     # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: earthquake
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python src/earthquake.py
        env:
          DISCORD_WEBHOOK_EARTHQUAKE: ${{ secrets.DISCORD_WEBHOOK_EARTHQUAKE }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: earthquake"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
