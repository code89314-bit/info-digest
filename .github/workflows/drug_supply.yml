name: 医薬品供給情報

on:
  schedule:
    - cron: "17 1,4,7,10 * * 1-5"   # UTC表記（平日 10:17 / 13:17 / 16:17 / 19:17 JST）
  workflow_dispatch:     # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: drug_supply
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python src/drug_supply.py
        env:
          DISCORD_WEBHOOK_DRUG: ${{ secrets.DISCORD_WEBHOOK_DRUG }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: drug_supply"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
